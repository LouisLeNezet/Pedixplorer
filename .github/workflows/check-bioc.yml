## Acronyms:
## * GHA: GitHub Action
## * OS: operating system

name: R-CMD-check-bioc

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

env:
  has_testthat: 'true'
  run_covr: 'true'
  cache-version: 'cache-v1'

jobs:
  build-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-24.04, r: '4.5', bioc: '3.22', rspm: 'https://packagemanager.posit.co/cran/__linux__/noble/latest' }
          - { os: windows-latest, r: '4.5', bioc: '3.22', rspm: '' }

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      NOT_CRAN: true
      TZ: UTC

    steps:
      ## For linux add dependencies
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-dev \
            libgtk-3-dev \
            gnupg2 \
            libglpk-dev

      ## Set up Chrome for shinytest
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 130
          install-dependencies: true

      ## Most of these steps are the same as the ones in
      ## https://github.com/r-lib/actions/blob/master/examples/check-standard.yaml
      ## If they update their steps, we will also need to update ours.
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R from r-lib
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Setup pandoc from r-lib
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set R library home
        shell: bash
        run: |
          echo "R_LIBS_USER=${RUNNER_TEMP}/Library" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/Library"
          chmod -R u+rwX "${RUNNER_TEMP}/Library"

      - name: Query dependencies
        run: |
          install.packages('remotes', lib = Sys.getenv("R_LIBS_USER"))
          saveRDS(
            remotes::dev_package_deps(dependencies = TRUE),
            ".github/depends.Rds",
            version = 2
          )
        shell: Rscript {0}

      - name: Restore R package cache
        if: "!contains(github.event.head_commit.message || github.event.pull_request.title || '', '/nocache')"
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Library
          key: ${{ env.cache-version }}-${{ runner.os }}-biocversion-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ env.cache-version }}-${{ runner.os }}-biocversion-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-

      - name: Install BiocManager
        run: |
          message(paste('****', Sys.time(), 'installing BiocManager ****'))
          remotes::install_cran("BiocManager", lib = Sys.getenv("R_LIBS_USER"))
        shell: Rscript {0}

      - name: Set BiocVersion & install check packages
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)

          # Install BiocManager from CRAN first
          cran <- Sys.getenv("RSPM")

          install.packages(
            "BiocManager",
            repos = cran,
            lib = lib
          )

          # Configure Bioconductor and CRAN repositories
          repos <- BiocManager::repositories()
          if (Sys.info()[["sysname"]] == "Linux") {
            repos["CRAN"] <- Sys.getenv("RSPM")
          }
          options(repos = repos)

          BiocManager::install(
            version = "${{ matrix.config.bioc }}",
            ask = FALSE, force = FALSE, update = FALSE,
            lib = lib
          )
          ## For running the checks
          message(paste('****', Sys.time(), 'installing rcmdcheck and BiocCheck ****'))
          BiocManager::install(
            "BiocCheck",
            ask = FALSE, update = FALSE,
            lib = lib
          )

          install.packages(
            c("rcmdcheck", "covr"),
            lib = lib
          )
        shell: Rscript {0}

      - name: Install dependencies pass 1
        run: |
          ## Try installing the package dependencies in steps.
          ## Ideally, all dependencies should get installed in the first pass.

          ## Pass #1 at installing dependencies
          message(paste('****', Sys.time(), 'pass number 1 at installing dependencies: local dependencies ****'))
          repos <- BiocManager::repositories()
          if (Sys.info()[["sysname"]] == "Linux") {
            repos["CRAN"] <- Sys.getenv("RSPM")
          }
          options(repos = repos)
          remotes::install_local(
            dependencies = TRUE,
            build_vignettes = FALSE, upgrade = TRUE,
            lib = Sys.getenv("R_LIBS_USER")
          )
        continue-on-error: true
        shell: Rscript {0}

      - name: Install dependencies pass 2
        run: |
          ## Pass #2 at installing dependencies
          message(paste('****', Sys.time(), 'pass number 2 at installing dependencies: any remaining dependencies ****'))
          repos <- BiocManager::repositories()
          if (Sys.info()[["sysname"]] == "Linux") {
            repos["CRAN"] <- Sys.getenv("RSPM")
          }
          options(repos = repos)
          remotes::install_local(
            dependencies = TRUE,
            build_vignettes = TRUE, upgrade = TRUE, force = TRUE,
            lib = Sys.getenv("R_LIBS_USER")
          )
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Run CMD check
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMOTE_HEADLESS: "1"
          CHROMOTE_ARGS: "--no-sandbox --disable-gpu"
          _R_CHECK_CRAN_INCOMING_: false
          DISPLAY: 99.0
        run: |
          options(
            tarShortenPaths = TRUE,
            crayon.enabled = TRUE
          )
          rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--no-vignettes", "--timings"),
              build_args = c("--no-manual", "--keep-empty-dirs", "--no-resave-data"),
              error_on = "warning",
              check_dir = "check"
          )
        shell: Rscript {0}

      - name: Debug check
        if: failure()
        run: find . -name 00check.log -exec cat '{}' ';'

      - name: Reveal testthat details
        if:  env.has_testthat == 'true'
        run: find . -name testthat.Rout -exec cat '{}' ';'

      - name: Run BiocCheck
        env:
          DISPLAY: 99.0
        run: |
          BiocCheck::BiocCheck(
              dir('check', 'tar.gz$', full.names = TRUE),
              `quit-with-status` = TRUE,
              `no-check-version-num` = TRUE,
              `no-check-R-ver` = TRUE,
              `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}

      - name: Test coverage
        if: env.run_covr == 'true' && runner.os == 'Linux'
        env:
          SKIP_SHINY_TESTS: "TRUE"
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Debug failed tests
        if: failure() && env.run_covr == 'true' && runner.os == 'Linux'
        run: |
          if [ -f "${{ runner.temp }}/package/Pedixplorer/Pedixplorer-tests/testthat.Rout.fail" ]; then
            cat "${{ runner.temp }}/package/Pedixplorer/Pedixplorer-tests/testthat.Rout.fail"
          else
            echo "No failed test output available."
          fi
        shell: bash

      - uses: codecov/codecov-action@v4
        if: env.run_covr == 'true' && runner.os == 'Linux'
        with:
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-biocversion-RELEASE${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-results
          path: check
          if-no-files-found: ignore
