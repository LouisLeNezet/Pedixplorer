## Github Actions workflow to deploy pkgdown website to GitHub pages
## This workflow is triggered by pushes to the devel branch
## and is only run on Linux runners
name: Deploy pkgdown site

on:
  push:
    branches: [devel]
  pull_request:
    branches: [main, devel]

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    ## Environment variables unique to this job.

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: '4.5', bioc: '3.22', cont: "bioconductor/bioconductor_docker:RELEASE_3_22", rspm: "https://packagemanager.rstudio.com/cran/__linux__/jammy/latest" }

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      NOT_CRAN: true
      TZ: UTC
      CACHE_VERSION: cache-v1

    steps:
      ## Most of these steps are the same as the ones in
      ## https://github.com/r-lib/actions/blob/master/examples/check-standard.yaml
      ## If they update their steps, we will also need to update ours.
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Set R library home
        shell: bash
        run: |
          echo "R_LIBS_USER=${RUNNER_TEMP}/Library" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/Library"

      ## R is already included in the Bioconductor docker images
      - name: Setup R from r-lib
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      ## pandoc is already included in the Bioconductor docker images
      - name: Setup pandoc from r-lib
        uses: r-lib/actions/setup-pandoc@v2

      - name: Query dependencies
        run: |
          install.packages('remotes', lib = Sys.getenv("R_LIBS_USER"))
          saveRDS(
            remotes::dev_package_deps(dependencies = TRUE),
            ".github/depends.Rds",
            version = 2
          )
        shell: Rscript {0}

      - name: Cache R packages
        if: ${{ !contains(github.event.head_commit.message || github.event.pull_request.title || '', '/nocache') }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Library
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-bioc-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-bioc-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-

      - name: Configure Bioconductor and install pkgdown
        run: |
          repos <- BiocManager::repositories()
          repos["CRAN"] <- Sys.getenv("RSPM")
          options(repos = repos)

          BiocManager::install(
            version = "3.22",
            ask = FALSE,
            update = FALSE,
            force = FALSE,
            lib = Sys.getenv("R_LIBS_USER")
          )

          install.packages(
            "pkgdown",
            lib = Sys.getenv("R_LIBS_USER")
          )
        shell: Rscript {0}
      
      - name: Install dependencies pass 1
        run: |
          repos <- BiocManager::repositories()
          repos["CRAN"] <- Sys.getenv("RSPM")
          options(repos = repos)

          remotes::install_local(
            dependencies = TRUE,
            build_vignettes = FALSE,
            upgrade = "never",
            lib = Sys.getenv("R_LIBS_USER")
          )
        continue-on-error: true
        shell: Rscript {0}

      - name: Install dependencies pass 2
        run: |
          repos <- BiocManager::repositories()
          repos["CRAN"] <- Sys.getenv("RSPM")
          options(repos = repos)

          remotes::install_local(
            dependencies = TRUE,
            build_vignettes = TRUE,
            upgrade = "never",
            lib = Sys.getenv("R_LIBS_USER")
          )
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL --library="$R_LIBS_USER" .

      - name: Build pkgdown site
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}
        ## Note that you need to run pkgdown::deploy_to_branch(new_process = FALSE)
        ## at least one locally before this will work. This creates the gh-pages
        ## branch (erasing anything you haven't version controlled!) and
        ## makes the git history recognizable by pkgdown.

      - name: Install deployment dependencies
        run: |
          for i in {1..5}; do
            apt-get update && apt-get install -y rsync && break
            sleep 15
          done

      - name: Deploy pkgdown site to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs
          clean: false
